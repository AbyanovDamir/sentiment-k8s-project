apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment
spec:
  replicas: 3
  selector:
    matchLabels: {app: sentiment}
  template:
    metadata:
      labels: {app: sentiment}
    spec:
      containers:
        - name: sentiment
          image: sentiment-app:1.0.0
          imagePullPolicy: Never
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 80
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
